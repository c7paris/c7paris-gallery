backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Gallery"
    files:
      - name: "gallery"
        label: "Gallery"
        file: "content/gallery.json"
        fields:
          - label: "Profile image"
            name: "profile_image"
            widget: "image"
            required: false

          - label: "Gallery items"
            name: "gallery"
            widget: "list"
            required: false
            summary: "{{fields.type}} - {{fields.media}}"
            fields:
              - label: "Type"
                name: "type"
                widget: "select"
                options:
                  - { label: "Image", value: "image" }
                  - { label: "Video", value: "video" }
                default: "image"

              - label: "Media file"
                name: "media"
                widget: "file"
                required: true
