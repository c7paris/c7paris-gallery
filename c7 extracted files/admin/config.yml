backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Gallery"
    files:
      - name: "gallery"
        label: "Gallery"
        file: "content/gallery.json"
        fields:
          - label: "Profile image"
            name: "profile_image"
            widget: "image"
            required: false

          - label: "Gallery images"
            name: "gallery"
            widget: "image"
            media_library:
              config:
                multiple: true
            required: false
