<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C7 Paris Gallery</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 935px;
      margin: 0 auto;
      min-height: 100vh;
    }

   .header {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 0 24px;
}

    .profile-image {
      width: 144px;
      height: 144px;
      border-radius: 50%;
      overflow: hidden;
      background: #f2f2f2;
    }

    .profile-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
.credit {
  margin: 16px 0 0;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.credit-divider {
  display: inline-block;
  margin: 0 8px;
  font-size: 13px;
  font-weight: 300;
  line-height: 1;
  opacity: 0.55;
}

.poster-credit {
  display: none;
  margin: 0 0 18px;
  text-align: center;
}
    .tracks-intro {
  display: none;
  margin: 0 0 18px;
  text-align: center;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .tile {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #f2f2f2;
    }

    .tile img,
    .tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
.tabs {
  display: flex;
  justify-content: center;
  gap: 28px;
  padding: 0 0 22px;
}

.tab {
  border: 0;
  background: transparent;
  color: #777;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 8px 0;
  text-transform: uppercase;
}

.tab.active {
  color: #000;
}
    .track-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.track-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #eee;
}

.track-title {
  margin: 0 0 8px;
  font-size: 14px;
  font-weight: 600;
}

.track-item audio {
  width: 100%;
}

.download-link {
  color: #000;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  line-height: 1;
  text-decoration: none;
  text-transform: uppercase;
  white-space: nowrap;
}
    @media (max-width: 600px) {
      .header {
        padding: 32px 0;
      }

      .profile-image {
        width: 112px;
        height: 112px;
      }

      .grid {
        gap: 1px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
<header class="header">
  <div class="profile-image">
    <img id="profileImage" alt="" />
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="photos">Photos</button>
  <button class="tab" data-tab="videos">Videos</button>
  <button class="tab" data-tab="posters">Posters</button>
  <button class="tab" data-tab="tracks">Free tracks</button>
</nav>

<p id="posterCredit" class="credit poster-credit">
  By Danya Ben Yosef <span class="credit-divider">|</span> @danyabenyosef
</p>

<p id="tracksIntro" class="tracks-intro">
  Free music for you. Produced by us.
</p>

<section id="galleryGrid" class="grid"></section>
  </main>

<script>
  const githubApiUrl =
    "https://api.github.com/repos/c7paris/c7paris-gallery/contents/c7%20extracted%20files/images/uploads?ref=main";

  const imageExtensions = [".jpg", ".jpeg", ".png", ".gif", ".webp", ".avif"];
  const videoExtensions = [".mp4", ".webm", ".mov"];
  const audioExtensions = [".wav"];

  let photos = [];
  let videos = [];
  let posters = [];
  let tracks = [];
  let currentTab = "photos";

  function getFileExtension(filename) {
    return filename.toLowerCase().slice(filename.lastIndexOf("."));
  }

  function shuffle(items) {
    const shuffled = [...items];

    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    return shuffled;
  }

  function formatTrackTitle(filename) {
    return filename
      .replace(/\.[^/.]+$/, "")
      .replace(/^track-\d+-?/i, "")
      .replace(/[-_]/g, " ")
      .trim();
  }

  function renderGallery(items) {
    const galleryGrid = document.getElementById("galleryGrid");

    galleryGrid.className = "grid";
    galleryGrid.innerHTML = "";

    items.forEach(function (file) {
      const extension = getFileExtension(file.name);

      const tile = document.createElement("div");
      tile.className = "tile";

      if (videoExtensions.includes(extension)) {
        const video = document.createElement("video");
        video.src = file.download_url;
        video.controls = true;
        video.playsInline = true;
        tile.appendChild(video);
      } else {
        const img = document.createElement("img");
        img.src = file.download_url;
        img.alt = "";
        tile.appendChild(img);
      }

      galleryGrid.appendChild(tile);
    });
  }

  function renderTracks(items) {
    const galleryGrid = document.getElementById("galleryGrid");

    galleryGrid.className = "track-list";
    galleryGrid.innerHTML = "";

    items.forEach(function (file) {
      const trackItem = document.createElement("div");
      trackItem.className = "track-item";

      const left = document.createElement("div");

      const title = document.createElement("p");
      title.className = "track-title";
      title.textContent = formatTrackTitle(file.name) || file.name;

      const audio = document.createElement("audio");
      audio.src = file.download_url;
      audio.controls = true;

      left.appendChild(title);
      left.appendChild(audio);

      const download = document.createElement("a");
      download.className = "download-link";
      download.href = file.download_url;
      download.download = file.name;
      download.textContent = "Download WAV";
      download.setAttribute("aria-label", "Download " + file.name);

      trackItem.appendChild(left);
      trackItem.appendChild(download);

      galleryGrid.appendChild(trackItem);
    });
  }

  function setActiveTab(tabName) {
    currentTab = tabName;

    document.querySelectorAll(".tab").forEach(function (button) {
      button.classList.toggle("active", button.dataset.tab === tabName);
    });

   const posterCredit = document.getElementById("posterCredit");
const tracksIntro = document.getElementById("tracksIntro");

if (posterCredit) {
  posterCredit.style.display = tabName === "posters" ? "block" : "none";
}

if (tracksIntro) {
  tracksIntro.style.display = tabName === "tracks" ? "block" : "none";
}

    if (tabName === "videos") {
      renderGallery(videos);
    } else if (tabName === "posters") {
      renderGallery(posters);
    } else if (tabName === "tracks") {
      renderTracks(tracks);
    } else {
      renderGallery(photos);
    }
  }

  async function loadGallery() {
    const profileImage = document.getElementById("profileImage");

    try {
      const response = await fetch(githubApiUrl, { cache: "no-store" });
      const files = await response.json();

      const mediaFiles = files
        .filter(function (file) {
          if (file.type !== "file") return false;

          const extension = getFileExtension(file.name);

          return (
            imageExtensions.includes(extension) ||
            videoExtensions.includes(extension) ||
            audioExtensions.includes(extension)
          );
        })
        .sort(function (a, b) {
          return a.name.localeCompare(b.name, undefined, {
            numeric: true,
            sensitivity: "base"
          });
        });

      if (mediaFiles.length > 0) {
        profileImage.src = mediaFiles[0].download_url;
        profileImage.style.display = "block";
      }

      const galleryFiles = mediaFiles.slice(1);

      posters = shuffle(
        galleryFiles.filter(function (file) {
          const extension = getFileExtension(file.name);
          return imageExtensions.includes(extension) && file.name.toLowerCase().includes("poster");
        })
      );

      photos = shuffle(
        galleryFiles.filter(function (file) {
          const extension = getFileExtension(file.name);
          return imageExtensions.includes(extension) && !file.name.toLowerCase().includes("poster");
        })
      );

      videos = shuffle(
        galleryFiles.filter(function (file) {
          return videoExtensions.includes(getFileExtension(file.name));
        })
      );

      tracks = galleryFiles.filter(function (file) {
        return audioExtensions.includes(getFileExtension(file.name));
      });

      setActiveTab(currentTab);
    } catch (error) {
      console.error("Could not load uploaded files", error);
    }
  }

  document.querySelectorAll(".tab").forEach(function (button) {
    button.addEventListener("click", function () {
      setActiveTab(button.dataset.tab);
    });
  });

  loadGallery();
</script>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function () {
      if (window.location.hash.includes("invite_token") || window.location.hash.includes("recovery_token")) {
        window.netlifyIdentity.open();
      }
    });
  }
</script>
</body>
</html>
