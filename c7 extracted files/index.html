<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C7 Paris Gallery</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 935px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: center;
      padding: 40px 0;
    }

    .profile-image {
      width: 144px;
      height: 144px;
      border-radius: 50%;
      overflow: hidden;
      background: #f2f2f2;
    }

    .profile-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .tile {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #f2f2f2;
    }

    .tile img,
    .tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 600px) {
      .header {
        padding: 32px 0;
      }

      .profile-image {
        width: 112px;
        height: 112px;
      }

      .grid {
        gap: 1px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="profile-image">
        <img id="profileImage" alt="" />
      </div>
    </header>

    <section id="galleryGrid" class="grid"></section>
  </main>

  <script>
  const githubApiUrl =
    "https://api.github.com/repos/c7paris/c7paris-gallery/contents/c7%20extracted%20files/images/uploads?ref=main";

  const imageExtensions = [".jpg", ".jpeg", ".png", ".gif", ".webp", ".avif"];
  const videoExtensions = [".mp4", ".webm", ".mov"];

  function getFileExtension(filename) {
    return filename.toLowerCase().slice(filename.lastIndexOf("."));
  }

  async function loadGallery() {
    const profileImage = document.getElementById("profileImage");
    const galleryGrid = document.getElementById("galleryGrid");

    try {
      const response = await fetch(githubApiUrl, { cache: "no-store" });
      const files = await response.json();

      const mediaFiles = files.filter(function (file) {
        if (file.type !== "file") return false;

        const extension = getFileExtension(file.name);

        return (
          imageExtensions.includes(extension) ||
          videoExtensions.includes(extension)
        );
      });

      galleryGrid.innerHTML = "";

      if (mediaFiles.length > 0) {
        profileImage.src = mediaFiles[0].download_url;
        profileImage.style.display = "block";
      }

      mediaFiles.forEach(function (file) {
        const extension = getFileExtension(file.name);

        const tile = document.createElement("div");
        tile.className = "tile";

        if (videoExtensions.includes(extension)) {
          const video = document.createElement("video");
          video.src = file.download_url;
          video.controls = true;
          video.playsInline = true;
          tile.appendChild(video);
        } else {
          const img = document.createElement("img");
          img.src = file.download_url;
          img.alt = "";
          tile.appendChild(img);
        }

        galleryGrid.appendChild(tile);
      });
    } catch (error) {
      console.error("Could not load uploaded files", error);
    }
  }

  loadGallery();
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function () {
      if (window.location.hash.includes("invite_token") || window.location.hash.includes("recovery_token")) {
        window.netlifyIdentity.open();
      }
    });
  }
</script>
</body>
</html>
