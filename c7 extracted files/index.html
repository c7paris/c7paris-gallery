<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C7 Paris Gallery</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 935px;
      margin: 0 auto;
      min-height: 100vh;
    }

   .header {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 0 24px;
}

    .profile-image {
      width: 144px;
      height: 144px;
      border-radius: 50%;
      overflow: hidden;
      background: #f2f2f2;
    }

    .profile-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
.credit {
  margin: 16px 0 0;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.credit-divider {
  display: inline-block;
  margin: 0 8px;
  font-size: 13px;
  font-weight: 300;
  line-height: 1;
  opacity: 0.55;
}
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .tile {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #f2f2f2;
    }

    .tile img,
    .tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
.tabs {
  display: flex;
  justify-content: center;
  gap: 28px;
  padding: 0 0 22px;
}

.tab {
  border: 0;
  background: transparent;
  color: #777;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 8px 0;
  text-transform: uppercase;
}

.tab.active {
  color: #000;
}
    @media (max-width: 600px) {
      .header {
        padding: 32px 0;
      }

      .profile-image {
        width: 112px;
        height: 112px;
      }

      .grid {
        gap: 1px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
<header class="header">
  <div class="profile-image">
    <img id="profileImage" alt="" />
  </div>

  <p class="credit">
    By Danya Ben Yosef <span class="credit-divider">|</span> @danyabenyosef
  </p>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="photos">Photos</button>
  <button class="tab" data-tab="videos">Videos</button>
  <button class="tab" data-tab="posters">Posters</button>
</nav>

<section id="galleryGrid" class="grid"></section>
  </main>

<script>
  const githubApiUrl =
    "https://api.github.com/repos/c7paris/c7paris-gallery/contents/c7%20extracted%20files/images/uploads?ref=main";

  const imageExtensions = [".jpg", ".jpeg", ".png", ".gif", ".webp", ".avif"];
  const videoExtensions = [".mp4", ".webm", ".mov"];

let photos = [];
let videos = [];
let posters = [];
let currentTab = "photos";

  function getFileExtension(filename) {
    return filename.toLowerCase().slice(filename.lastIndexOf("."));
  }

  function shuffle(items) {
    const shuffled = [...items];

    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    return shuffled;
  }

  function renderGallery(items) {
    const galleryGrid = document.getElementById("galleryGrid");

    galleryGrid.innerHTML = "";

    items.forEach(function (file) {
      const extension = getFileExtension(file.name);

      const tile = document.createElement("div");
      tile.className = "tile";

      if (videoExtensions.includes(extension)) {
        const video = document.createElement("video");
        video.src = file.download_url;
        video.controls = true;
        video.playsInline = true;
        tile.appendChild(video);
      } else {
        const img = document.createElement("img");
        img.src = file.download_url;
        img.alt = "";
        tile.appendChild(img);
      }

      galleryGrid.appendChild(tile);
    });
  }

  function setActiveTab(tabName) {
    currentTab = tabName;

    document.querySelectorAll(".tab").forEach(function (button) {
      button.classList.toggle("active", button.dataset.tab === tabName);
    });

    if (tabName === "videos") {
  renderGallery(videos);
} else if (tabName === "posters") {
  renderGallery(posters);
} else {
  renderGallery(photos);
}
  }

  async function loadGallery() {
    const profileImage = document.getElementById("profileImage");

    try {
      const response = await fetch(githubApiUrl, { cache: "no-store" });
      const files = await response.json();

      const mediaFiles = files
        .filter(function (file) {
          if (file.type !== "file") return false;

          const extension = getFileExtension(file.name);

          return (
            imageExtensions.includes(extension) ||
            videoExtensions.includes(extension)
          );
        })
        .sort(function (a, b) {
          return a.name.localeCompare(b.name, undefined, {
            numeric: true,
            sensitivity: "base"
          });
        });

      if (mediaFiles.length > 0) {
        profileImage.src = mediaFiles[0].download_url;
        profileImage.style.display = "block";
      }

      const galleryFiles = mediaFiles.slice(1);

     posters = shuffle(
  galleryFiles.filter(function (file) {
    const extension = getFileExtension(file.name);
    return imageExtensions.includes(extension) && file.name.toLowerCase().includes("poster");
  })
);

photos = shuffle(
  galleryFiles.filter(function (file) {
    const extension = getFileExtension(file.name);
    return imageExtensions.includes(extension) && !file.name.toLowerCase().includes("poster");
  })
);

videos = shuffle(
  galleryFiles.filter(function (file) {
    return videoExtensions.includes(getFileExtension(file.name));
  })
);

      setActiveTab(currentTab);
    } catch (error) {
      console.error("Could not load uploaded files", error);
    }
  }

  document.querySelectorAll(".tab").forEach(function (button) {
    button.addEventListener("click", function () {
      setActiveTab(button.dataset.tab);
    });
  });

  loadGallery();
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function () {
      if (window.location.hash.includes("invite_token") || window.location.hash.includes("recovery_token")) {
        window.netlifyIdentity.open();
      }
    });
  }
</script>
</body>
</html>
