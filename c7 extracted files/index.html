<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C7 Paris Gallery</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 935px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: center;
      padding: 40px 0;
    }

    .profile-image {
      width: 144px;
      height: 144px;
      border-radius: 50%;
      overflow: hidden;
      background: #f2f2f2;
    }

    .profile-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .tile {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #f2f2f2;
    }

    .tile img,
    .tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 600px) {
      .header {
        padding: 32px 0;
      }

      .profile-image {
        width: 112px;
        height: 112px;
      }

      .grid {
        gap: 1px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="profile-image">
        <img id="profileImage" alt="" />
      </div>
    </header>

    <section id="galleryGrid" class="grid"></section>
  </main>

  <script>
    async function loadGallery() {
      try {
        const response = await fetch("/content/gallery.json", { cache: "no-store" });
        const data = await response.json();

        const profileImage = document.getElementById("profileImage");
        const galleryGrid = document.getElementById("galleryGrid");

        if (data.profile_image) {
          profileImage.src = data.profile_image;
          profileImage.style.display = "block";
        }

        galleryGrid.innerHTML = "";

        const items = Array.isArray(data.gallery) ? data.gallery : [];

        items.forEach(function (item) {
          if (!item.media) return;

          const tile = document.createElement("div");
          tile.className = "tile";

          if (item.type === "video") {
            const video = document.createElement("video");
            video.src = item.media;
            video.controls = true;
            video.playsInline = true;
            tile.appendChild(video);
          } else {
            const img = document.createElement("img");
            img.src = item.media;
            img.alt = "";
            tile.appendChild(img);
          }

          galleryGrid.appendChild(tile);
        });
      } catch (error) {
        console.error("Could not load gallery.json", error);
      }
    }

    loadGallery();
  </script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function (user) {
      if (!user && window.location.hash) {
        window.netlifyIdentity.open();
      }
    });

    window.netlifyIdentity.on("login", function () {
      window.location.href = "/admin/";
    });
  }
</script>
</body>
</html>
